<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数URL開くツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            padding: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #3367d6;
        }
        .options {
            margin-bottom: 15px;
        }
        .tab {
            margin-bottom: 20px;
        }
        .tab-links {
            display: flex;
            margin-bottom: 10px;
        }
        .tab-link {
            padding: 8px 15px;
            background-color: #f1f1f1;
            cursor: pointer;
            border: 1px solid #ccc;
            border-bottom: none;
            margin-right: 5px;
        }
        .tab-link.active {
            background-color: #fff;
            border-bottom: 1px solid white;
        }
        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>複数タブ開くツール</h1>
    
    <div class="tab">
        <div class="tab-links">
            <div class="tab-link active" onclick="openTab('url-tab')">URLを開く</div>
            <div class="tab-link" onclick="openTab('search-tab')">検索する</div>
        </div>
        
        <div id="url-tab" class="tab-content active">
            <p>開きたいURLを入力してください（1行に1つのURL）</p>
            <p><small>※ https:// または http:// から始まるURLを入力してください</small></p>
            <textarea id="urls" placeholder="例：
https://www.google.com
https://www.yahoo.co.jp
https://www.bing.com"></textarea>
            
            <button id="open-urls-button">URLを開く</button>
        </div>
        
        <div id="search-tab" class="tab-content">
            <p>検索したい文字列を入力してください（1行に1つの検索語）</p>
            
            <div class="options">
                <label for="search-engine">検索エンジン：</label>
                <select id="search-engine">
                    <option value="https://www.google.com/search?q=">Google</option>
                    <option value="https://www.bing.com/search?q=">Bing</option>
                    <option value="https://search.yahoo.co.jp/search?p=">Yahoo! JAPAN</option>
                    <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                </select>
            </div>
            
            <textarea id="search-terms" placeholder="例：
東京 観光
大阪 グルメ
京都 紅葉"></textarea>
            
            <button id="search-button">検索開始</button>
        </div>
    </div>
    
    <script>
        // タブ切り替え機能
        function openTab(tabId) {
            const tabContents = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove('active');
            }
            
            const tabLinks = document.getElementsByClassName('tab-link');
            for (let i = 0; i < tabLinks.length; i++) {
                tabLinks[i].classList.remove('active');
            }
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        
        // URLを開く機能
        document.getElementById('open-urls-button').addEventListener('click', function() {
            const urls = document.getElementById('urls').value
                .split('\n')
                .map(url => url.trim())
                .filter(url => url);
            
            if (urls.length === 0) {
                alert('URLを入力してください。');
                return;
            }
            
            // URLの形式をチェック
            const validUrls = urls.map(url => {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    return 'https://' + url;
                }
                return url;
            });
            
            // ポップアップブロックの対策として、ユーザーのクリックイベント内で直接開く
            validUrls.forEach(url => {
                window.open(url, '_blank');
            });
        });
        
        // 検索機能
        document.getElementById('search-button').addEventListener('click', function() {
            const searchTerms = document.getElementById('search-terms').value
                .split('\n')
                .map(term => term.trim())
                .filter(term => term);
            
            if (searchTerms.length === 0) {
                alert('検索する文字列を入力してください。');
                return;
            }
            
            const searchEngine = document.getElementById('search-engine').value;
            
            // ポップアップブロックの対策として、ユーザーのクリックイベント内で直接開く
            searchTerms.forEach(term => {
                const searchUrl = searchEngine + encodeURIComponent(term);
                window.open(searchUrl, '_blank');
            });
        });
    </script>
</body>
</html>
